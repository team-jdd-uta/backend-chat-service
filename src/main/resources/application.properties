server.port=8083
spring.application.name=chat-service
spring.redis.cluster.nodes=localhost:7000,localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005

room.service.base-url=http://localhost:8082
room.service.connect-timeout-ms=1000
room.service.read-timeout-ms=3000

chat.stream.redis.host=localhost
chat.stream.redis.port=6379
chat.stream.key-prefix=chat:stream:room:

chat.pubsub.publish.retry.max-attempts=3
chat.pubsub.publish.retry.backoff-ms=200

